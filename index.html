<title>오늘 어디 갈까? 아들과 나들이</title>
<script>try{var t=localStorage.getItem("th-theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<style>
  :root{
    --bg:#f3f6fb; --card:#ffffff; --ink:#1b2430; --mute:#6a7686; --line:#e4e9f1;
    --accent:#3b82f6; --accent2:#8b5cf6; --good:#16a34a; --warn:#f59e0b; --bad:#ef4444;
    --in:#e0ecff; --in-ink:#1d4ed8; --out:#dcfce7; --out-ink:#15803d; --mix:#fef3c7; --mix-ink:#a16207;
    --shadow:0 6px 24px rgba(30,60,120,.08);
    --hero1:#4f9bff; --hero2:#7c5cff;
  }
  :root{color-scheme:light}
  :root[data-theme="dark"]{color-scheme:dark;--bg:#0e131b;--card:#171e29;--ink:#e9eef5;--mute:#93a0b1;--line:#263041;
      --in:#1e2f55;--in-ink:#9cc1ff;--out:#17382a;--out-ink:#7ee0a6;--mix:#3d3115;--mix-ink:#f5cf6b;
      --shadow:0 6px 24px rgba(0,0,0,.35)}
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){color-scheme:dark;--bg:#0e131b;--card:#171e29;--ink:#e9eef5;--mute:#93a0b1;--line:#263041;
      --in:#1e2f55;--in-ink:#9cc1ff;--out:#17382a;--out-ink:#7ee0a6;--mix:#3d3115;--mix-ink:#f5cf6b;
      --shadow:0 6px 24px rgba(0,0,0,.35)}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;line-height:1.5;min-height:100vh}
  main{max-width:760px;margin:0 auto;padding:0 16px 40px}

  /* 히어로 */
  .hero{position:relative;margin:0 -16px 16px;padding:28px 20px 72px;color:#fff;overflow:hidden;
    background:linear-gradient(135deg,var(--hero1),var(--hero2));border-radius:0 0 28px 28px;transition:background .6s}
  .hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.12)}
  .hero::before{width:220px;height:220px;right:-60px;top:-80px}
  .hero::after{width:140px;height:140px;left:-40px;bottom:-60px}
  .hero h1{margin:0;font-size:1.55rem;letter-spacing:-.02em;position:relative}
  .hero p{margin:4px 0 0;opacity:.9;font-size:.9rem;position:relative}
  .hero.sunny{--hero1:#ffb347;--hero2:#ff7e5f}
  .hero.cloudy{--hero1:#6ea8ff;--hero2:#8e7bff}
  .hero.rainy{--hero1:#4b6cb7;--hero2:#182848}
  .hero.snowy{--hero1:#74b9ff;--hero2:#a29bfe}
  .hero.cold{--hero1:#5b8def;--hero2:#6c5ce7}

  .hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;position:relative}
  .theme-btn{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.2);color:#fff;font-size:1.2rem;cursor:pointer;line-height:1}
  .pick{display:flex;gap:8px;margin-top:14px;position:relative;flex-wrap:wrap}
  .pick select{flex:1 1 130px;min-width:0;padding:9px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.5);background:var(--card);color:var(--ink);font-size:.92rem;font-weight:600}
  .src{color:var(--mute);font-size:.76rem;margin:6px 2px 0}

  /* 날씨 카드 */
  .weather{margin-top:-56px;position:relative;background:var(--card);border-radius:22px;padding:18px 18px 16px;box-shadow:var(--shadow);border:1px solid var(--line)}
  .w-top{display:flex;align-items:center;gap:14px}
  .w-ico{font-size:3.2rem;line-height:1}
  .w-temp{font-size:2.6rem;font-weight:800;letter-spacing:-.03em;line-height:1}
  .w-sub{color:var(--mute);font-size:.9rem;margin-top:2px}
  .chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:14px}
  .chip{background:var(--bg);border-radius:12px;padding:8px 10px;font-size:.82rem}
  .chip b{display:block;font-size:.95rem;margin-top:1px}
  .chip .t{color:var(--mute);font-size:.72rem}
  .verdict{margin-top:14px;padding:12px 14px;border-radius:14px;font-weight:600;font-size:.95rem;background:var(--out);color:var(--out-ink)}
  .verdict.mid{background:var(--mix);color:var(--mix-ink)}
  .verdict.low{background:var(--in);color:var(--in-ink)}
  .verdict small{display:block;font-weight:400;opacity:.85;margin-top:2px}
  .loading{color:var(--mute);padding:6px 0;display:flex;align-items:center;gap:10px}
  .spin{width:18px;height:18px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .err{color:var(--bad);font-weight:600}
  .help{color:var(--mute);font-size:.8rem;margin-top:6px}
  .btn{margin-top:10px;padding:8px 18px;border-radius:99px;border:0;background:var(--accent);color:#fff;font-weight:600;cursor:pointer}

  /* 필터 */
  .section-title{display:flex;justify-content:space-between;align-items:baseline;margin:22px 2px 10px}
  .section-title h2{margin:0;font-size:1.1rem}
  .section-title span{color:var(--mute);font-size:.8rem}
  .filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
  .filters::-webkit-scrollbar{display:none}
  .filters button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 16px;border-radius:99px;cursor:pointer;font-size:.88rem;font-weight:500;transition:.15s}
  .filters button.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(80,90,230,.35)}

  /* 장소 카드 */
  .list{display:grid;gap:12px;margin-top:12px}
  .place{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow);display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:start}
  .place.top{border:2px solid var(--accent);background:linear-gradient(180deg,rgba(59,130,246,.07),transparent 60%),var(--card)}
  .ico{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-size:1.8rem;background:var(--bg)}
  .place h3{margin:0;font-size:1.05rem;letter-spacing:-.01em}
  .crown{display:inline-block;font-size:.72rem;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));padding:1px 9px;border-radius:99px;margin-right:6px;vertical-align:middle}
  .tags{margin-top:5px;display:flex;flex-wrap:wrap;gap:5px}
  .tag{font-size:.72rem;padding:2px 9px;border-radius:99px;background:var(--bg);color:var(--mute)}
  .tag.bad{background:rgba(239,68,68,.15);color:var(--bad)} .tag.ok{background:var(--out);color:var(--out-ink)} .tag.warn{background:var(--mix);color:var(--mix-ink)}
  .tag.in{background:var(--in);color:var(--in-ink)} .tag.out{background:var(--out);color:var(--out-ink)} .tag.mix{background:var(--mix);color:var(--mix-ink)}
  .tip{margin:8px 0 0;font-size:.88rem}
  .why{margin-top:6px;font-size:.82rem;color:var(--accent);font-weight:600}
  .why.bad{color:var(--bad)}
  .links{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
  .links a{font-size:.78rem;text-decoration:none;color:var(--ink);border:1px solid var(--line);padding:4px 11px;border-radius:99px}
  .links a:hover{border-color:var(--accent);color:var(--accent)}
  .score{text-align:center}
  .ring{--p:0;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;
    background:conic-gradient(var(--c,var(--accent)) calc(var(--p)*1%),var(--line) 0)}
  .ring i{font-style:normal;width:42px;height:42px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-weight:800;font-size:.9rem}
  .score small{color:var(--mute);font-size:.68rem}
  .empty{text-align:center;color:var(--mute);padding:30px 0}
  .note{color:var(--mute);font-size:.76rem;margin-top:22px;text-align:center}
  @media(max-width:460px){
    .place{grid-template-columns:48px 1fr;}
    .ico{width:48px;height:48px;font-size:1.5rem}
    .score{grid-column:1 / -1;display:flex;align-items:center;gap:10px;text-align:left}
  }
</style>
</head>

<main>
  <header class="hero" id="hero">
    <div class="hero-top">
      <div>
        <h1>🚗 오늘 어디 갈까?</h1>

  <div class="section-title"><h2>오늘의 추천 장소</h2><span id="count"></span></div>

    <button data-f="out">🌳 야외</button>

</main>

// sched[요일(0=일..6=토)] : undefined=알 수 없음 · []=휴관 · null=운영(시간 미상) · [[시작분,종료분],...]
const toMin = t => { const [h,m]=t.split(":"); return +h*60 + +m; };
const mkSched = (closed, open, close) => Array.from({length:7},(_,d)=> closed.includes(d) ? [] : (open ? [[toMin(open),toMin(close)]] : null));
// 큐레이션 장소 중 공식 휴관 요일이 알려진 곳(참고용): 이름 → [휴관요일, 개관, 폐관]

// OpenStreetMap opening_hours 의 단순한 형식만 해석 (예: "Tu-Su 09:00-18:00; Mo off"). 복잡하면 undefined(미확인)
const DAYI = {Su:0,Mo:1,Tu:2,We:3,Th:4,Fr:5,Sa:6};
function parseOH(str){
  if (!str) return undefined;
  str = str.trim();
  if (str==="24/7") return Array(7).fill(null);
  if (/PH|SH|sun(rise|set)|week|Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec|["\[+]/.test(str)) return undefined;
  const sched = Array(7).fill(undefined);
  for (let rule of str.split(";")){
    rule = rule.trim(); if(!rule) continue;
    const m = rule.match(/^([A-Za-z,\- ]*?)\s*((?:\d{1,2}:\d{2}-\d{1,2}:\d{2}(?:\s*,\s*)?)+|off|closed)$/i);
    if(!m) return undefined;
    let days = [];
    const spec = m[1].trim();
    if(!spec) days=[0,1,2,3,4,5,6];
    else for(const tk of spec.split(",")){
      const r = tk.trim().split("-").map(x=>DAYI[x.trim()]);
      if(r.length>2 || r.some(x=>x===undefined)) return undefined;
      if(r.length===1) days.push(r[0]);
      else for(let d=r[0];;d=(d+1)%7){ days.push(d); if(d===r[1]) break; }
    }
    const times = /off|closed/i.test(m[2]) ? [] : [...m[2].matchAll(/(\d{1,2}:\d{2})-(\d{1,2}:\d{2})/g)].map(x=>{ const a=toMin(x[1]); let b=toMin(x[2]); if(b<=a) b=1440; return [a,b]; });
    days.forEach(d=>sched[d]=times);
  }
  return sched.map(v=>v===undefined?[]:v);
}
function seoulNow(){
  const parts = new Intl.DateTimeFormat("en-US",{timeZone:"Asia/Seoul",weekday:"short",hour:"2-digit",minute:"2-digit",hour12:false}).formatToParts(new Date());
  const g = t => parts.find(x=>x.type===t).value;
  return {d:{Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6}[g("weekday")], min:(+g("hour")%24)*60 + +g("minute")};
}
const fm = m => String(Math.floor(m/60)%24).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
function openStatus(p, now){
  if (!p.sched) return {k:"unk", text:"운영시간 확인 필요", cls:"", pen:0};
  const t = p.sched[now.d];
  if (t && t.length===0) return {k:"closed", text:"오늘 휴관", cls:"bad", pen:60};
  if (t===null) return {k:"open", text:"오늘 운영", cls:"ok", pen:0};
  const range = t.find(r=>now.min>=r[0] && now.min<r[1]);
  if (range){
    const left = range[1]-now.min, hrs = `${fm(range[0])}~${fm(range[1])}`;
    return left<=90 ? {k:"soon", text:`곧 마감 · ${fm(range[1])}`, cls:"warn", pen:25} : {k:"open", text:`운영 중 · ${hrs}`, cls:"ok", pen:0};
  }
  const next = t.find(r=>now.min<r[0]);
  if (next) return {k:"before", text:`${fm(next[0])} 오픈`, cls:"warn", pen:0};
  return {k:"ended", text:"오늘 운영 종료", cls:"bad", pen:60};
}

// ---------- 유틸 ----------
const km = (a,b)=>{const R=6371,r=x=>x*Math.PI/180,dLat=r(b.lat-a.lat),dLon=r(b.lon-a.lon);
  const h=Math.sin(dLat/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(h));};
const driveMin = p => Math.round(km(HOME,p)*1.35/40*60);
const wcode = c => c===0?["맑음","☀️"]:c<=3?["구름","⛅"]:c<=48?["안개","🌫️"]:c<=57?["이슬비","🌦️"]:c<=67?["비","🌧️"]:c<=77?["눈","❄️"]:c<=82?["소나기","🌦️"]:c<=86?["눈","❄️"]:["뇌우","⛈️"];
const $ = id => document.getElementById(id);

// ---------- 날씨 ----------
async function getJSON(url, tries=3, ms=10000){
  let last;
  for (let i=0;i<tries;i++){
    try{
      // 미리보기 환경은 fetch 옵션(AbortSignal 등)을 복제하지 못하므로 옵션 없이 호출하고 타임아웃은 race로 처리
      let timer;
      const timeout = new Promise((_,rej)=>{ timer = setTimeout(()=>rej(new Error("시간 초과")), ms); });
      const r = await Promise.race([fetch(url), timeout]); clearTimeout(timer);
      if(!r.ok) throw new Error("HTTP "+r.status);
      return await r.json();
    }catch(e){ last = e; await new Promise(res=>setTimeout(res, 800*(i+1))); }
  }
  throw last;
}
async function loadWeather(){
  const f = `https://api.open-meteo.com/v1/forecast?latitude=${HOME.lat}&longitude=${HOME.lon}&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m&hourly=precipitation_probability&timezone=Asia%2FSeoul&forecast_days=1`;
  const a = `https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${HOME.lat}&longitude=${HOME.lon}&current=pm10,pm2_5&timezone=Asia%2FSeoul`;
  const [w, air] = await Promise.all([getJSON(f), getJSON(a,1).catch(()=>null)]);
  const now = new Date().getHours();
  const probs = w.hourly.precipitation_probability.slice(now, now+6);
  return {
    temp:w.current.temperature_2m, feel:w.current.apparent_temperature, code:w.current.weather_code,
    wind:w.current.wind_speed_10m, rain:Math.max(...probs,0),
    pm10:air?.current?.pm10 ?? null, pm25:air?.current?.pm2_5 ?? null
  };
}

function judge(w){
  let s = 100, why = [];
  const wet = w.code>=51 || w.rain>=50;
  if (wet){ s -= 60; why.push("비/눈 가능성"); }
  else if (w.rain>=30){ s -= 20; why.push("강수확률 약간 있음"); }
  if (w.feel>=31){ s -= 40; why.push("폭염"); }
  else if (w.feel>=28){ s -= 15; why.push("더운 편"); }
  if (w.feel<=0){ s -= 40; why.push("한파"); }
  else if (w.feel<=8){ s -= 35; why.push("쌀쌀함"); }
  if (w.wind>=10){ s -= 15; why.push("바람 강함"); }
  const pmBad = (w.pm25!=null && w.pm25>35) || (w.pm10!=null && w.pm10>80);
  const pmWorst = (w.pm25!=null && w.pm25>75) || (w.pm10!=null && w.pm10>150);
  if (pmWorst){ s -= 50; why.push("미세먼지 매우 나쁨"); }
  else if (pmBad){ s -= 30; why.push("미세먼지 나쁨"); }
  s = Math.max(0, s);
  const text = s>=70 ? "야외 활동하기 좋은 날씨예요 🌳" : s>=40 ? "야외도 가능하지만 실내와 섞는 걸 추천해요" : "오늘은 실내 위주로 가는 게 좋아요 🏠";
  return {score:s, why, text, level: s>=70?"":s>=40?"mid":"low"};
}

// ---------- 추천 ----------
function rank(w, j){
  const out = j.score, now = seoulNow();
  return PLACES.map(p=>{
    const t = driveMin(p);
    const fit = p.type==="in" ? 100-out : p.type==="out" ? out : 70;
    let s = fit*0.6 + p.age*4 - Math.max(0,t-30)*0.35;
    if (p.water && w.feel>=28 && out>=40) s += 15;
    const st = openStatus(p, now);
    s -= st.pen;
    s = Math.round(Math.max(0,Math.min(100,s)));
    const reasons = []; let bad = false;
    if (p.type==="in" && out<70) reasons.push("날씨 영향 없이 즐길 수 있어요");
    if (p.type==="out" && out>=70) reasons.push("날씨가 좋아 야외 추천");
    if (p.type==="out" && out<40){ reasons.push("오늘 날씨엔 비추천 ⚠️"); bad = true; }
    if (p.type==="mix") reasons.push("실내·야외 모두 가능");
    if (t<=20) reasons.push("가까워요");
    if (st.k==="closed"||st.k==="ended"){ reasons.unshift(st.text+" ⚠️"); bad = true; }
    return {...p, t, s, reasons, bad, st};
  }).sort((a,b)=>b.s-a.s);
}

        ${p.reasons.length?`<div class="why ${p.bad?"bad":""}">${p.reasons.join(" · ")}</div>`:""}
        <div class="links">
          <a target="_blank" rel="noopener" href="https://map.kakao.com/?q=${encodeURIComponent(p.q)}">카카오맵</a>
          <a target="_blank" rel="noopener" href="https://map.naver.com/p/search/${encodeURIComponent(p.q)}">네이버지도</a>
          <a target="_blank" rel="noopener" href="https://www.google.com/search?q=${encodeURIComponent(p.q+" 운영시간")}">운영시간</a>
        </div>
      </div>
      <div class="score"><div class="ring" style="--p:${p.s};--c:${c}"><i>${p.s}</i></div><small>추천점수</small></div>
    </article>`;
  }).join("") || '<div class="empty">조건에 맞는 장소가 없어요 🥲</div>';
}

$("filters").addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  state.filter = b.dataset.f;
  document.querySelectorAll("#filters button").forEach(x=>x.classList.toggle("on", x===b));
  renderList();
});

// ---------- 주변 장소 (OpenStreetMap Overpass) ----------
const OVERPASS = ["https://overpass-api.de/api/interpreter","https://overpass.kumi.systems/api/interpreter","https://overpass.private.coffee/api/interpreter"];
const CAT = {
  zoo:{e:"🦁",type:"out",stay:"3~4시간",age:5,tip:"동물원 · 아이들이 좋아해요. 우천 시 비추천"},
  aquarium:{e:"🐠",type:"in",stay:"2~3시간",age:5,tip:"수족관 · 날씨 영향 없이 즐길 수 있어요"},
  theme_park:{e:"🎢",type:"out",stay:"4~6시간",age:4,tip:"놀이공원 · 맑고 선선한 날 추천"},
  water_park:{e:"🏊",type:"out",stay:"3~4시간",age:4,tip:"물놀이 시설 · 더운 날 추천",water:true},
  museum:{e:"🏛️",type:"in",stay:"1~2시간",age:3,tip:"박물관/전시 · 휴관일·예약 여부 확인"},
  park:{e:"🌳",type:"out",stay:"1~2시간",age:3,tip:"공원 산책 · 자전거·킥보드 타기 좋아요"},
  attraction:{e:"📍",type:"mix",stay:"1~2시간",age:3,tip:"가볼 만한 명소"}
};
function catOf(t){
  if (t.tourism==="zoo") return "zoo";
  if (t.tourism==="aquarium") return "aquarium";
  if (t.tourism==="theme_park") return "theme_park";
  if (t.leisure==="water_park") return "water_park";
  if (t.tourism==="museum") return "museum";
  if (t.leisure==="park"||t.leisure==="nature_reserve") return "park";
  if (t.tourism==="attraction") return "attraction";
  return null;
}
async function overpass(query){
  const qs = "?data="+encodeURIComponent(query);
  return Promise.any(OVERPASS.map(ep=>getJSON(ep+qs,1,25000)));
}
async function loadNearby(c){
  const key = "th-near2-"+c.lat.toFixed(3)+","+c.lon.toFixed(3);
  try{ const hit = JSON.parse(localStorage.getItem(key)||"null"); if(hit && Date.now()-hit.t<7*864e5) return hit.v; }catch(e){}
  const a = `(around:20000,${c.lat},${c.lon})`;
  const q = `[out:json][timeout:20];(
    nwr["tourism"~"^(zoo|aquarium|theme_park|museum)$"]["name"]${a};
    nwr["leisure"="water_park"]["name"]${a};
    nwr["leisure"~"^(park|nature_reserve)$"]["name"]["wikidata"]${a};
    nwr["tourism"="attraction"]["name"]["wikidata"]${a};
  );out center tags 150;`;
  const d = await overpass(q), seen = new Set(), out = [];
  for (const el of d.elements||[]){
    const t = el.tags||{}, name = t["name:ko"]||t.name, cat = catOf(t);
    const lat = el.lat ?? el.center?.lat, lon = el.lon ?? el.center?.lon;
    if (!name || !cat || lat==null || !/[가-힣]/.test(name) || seen.has(name)) continue;
    seen.add(name);
    const base = CAT[cat];
    out.push({name, e:base.e, type:base.type, lat, lon, stay:base.stay, parking:"현장/주변 확인",
      age:/어린이|과학|체험|키즈/.test(name)?5:base.age, tip:base.tip, q:name, water:!!base.water, sched:parseOH(t.opening_hours), _p:(t.wikidata?2:0)+(cat==="park"||cat==="attraction"?0:1)});
  }
  // 가까운 곳 + 비중 높은 곳 우선으로 40개만
  out.sort((x,y)=>(y._p*8 - km(c,y)*0.6) - (x._p*8 - km(c,x)*0.6));
  const v = out.slice(0,40);
  try{ localStorage.setItem(key, JSON.stringify({t:Date.now(),v})); }catch(e){}
  return v;
}

// ---------- 지역/테마 ----------
const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
};
let token = 0;
const curatedNear = () => CURATED.filter(p=>km(HOME,p)<=60);

function applyTheme(t){
  if (t) document.documentElement.setAttribute("data-theme", t);
  const dark = document.documentElement.getAttribute("data-theme")==="dark" ||
    (!document.documentElement.getAttribute("data-theme") && matchMedia("(prefers-color-scheme:dark)").matches);
  $("themeBtn").textContent = dark ? "☀️" : "🌙";
  $("themeBtn").title = dark ? "라이트 모드로" : "다크 모드로";
  return dark;
}
$("themeBtn").addEventListener("click", ()=>{
  const dark = applyTheme(); const next = dark ? "light" : "dark";
  store.set("th-theme", next); applyTheme(next);
});

function fillSido(sel){
  $("selSido").innerHTML = Object.keys(REGIONS).map(n=>`<option ${n===sel?"selected":""}>${n}</option>`).join("");
}
function fillCity(sido, sel){
  $("selCity").innerHTML = REGIONS[sido].map(c=>`<option value="${c[0]}" ${c[0]===sel?"selected":""}>${c[0]}${sido==="세종특별자치시"?"":"시"}청 기준</option>`).join("");
}
function setRegion(sido, city){
  const c = REGIONS[sido].find(x=>x[0]===city) || REGIONS[sido][0];
  HOME = {lat:c[1], lon:c[2], label:c[0]+"시청"};
  store.set("th-region", JSON.stringify([sido,c[0]]));
  $("heroSub").textContent = `${HOME.label} 출발 · 8살 아들과 함께하는 나들이`;
  return init();
}
$("selSido").addEventListener("change", e=>{ fillCity(e.target.value); setRegion(e.target.value, $("selCity").value); });
$("selCity").addEventListener("change", ()=> setRegion($("selSido").value, $("selCity").value));

async function init(){
  const my = ++token;
  // 큐레이션 목록(수도권 근처)을 먼저 보여주고, 날씨와 주변 장소를 비동기로 채운다
  PLACES = curatedNear();
  state.results = rank({feel:20,wind:0}, {score:70});
  renderList();
  $("src").textContent = "";
  $("weatherCard").innerHTML = '<div class="loading"><div class="spin"></div>날씨 확인 중…</div>';

  let w=null, j=null;
  const weatherP = loadWeather().then(x=>{ if(my!==token) return; w=x; j=judge(x); renderWeather(w,j); state.results=rank(w,j); renderList(); })
    .catch(e=>{ if(my!==token) return;
      $("weatherCard").innerHTML = `<div class="err">날씨를 불러오지 못했어요 (${e.message})</div>
      <div class="help">• 앱 내 미리보기가 아니라 <b>크롬에서 직접</b> 열어 주세요 (run.bat 실행).<br>• 광고 차단 확장 프로그램이 api.open-meteo.com 을 막고 있지 않은지 확인하세요.<br>• 아래 목록은 날씨 없이 기본 순서(맑음 가정)입니다.</div>
      <button class="btn" onclick="init()">다시 시도</button>`; });

  // 큐레이션이 충분하지 않은 지역은 OpenStreetMap에서 추가 장소를 가져온다
  if (PLACES.length < 12){
    $("src").textContent = `${HOME.label} 주변 추가 장소를 찾는 중… (기본 추천은 먼저 표시)`;
    try{
      const near = await loadNearby(HOME);
      if (my!==token) return;
      PLACES = [...PLACES, ...near];
      $("src").textContent = near.length ? `${HOME.label} 반경 20km 내 추가 장소 ${near.length}곳 (OpenStreetMap 기준, 정보가 부족할 수 있어요)` : "주변에서 추가로 찾은 장소는 없어요.";
    }catch(e){
      if (my!==token) return;
      $("src").innerHTML = '추가 장소를 불러오지 못했어요 (기본 추천만 표시). <button class="btn" style="margin:0 0 0 6px;padding:3px 12px" onclick="init()">다시 시도</button>';
    }
    await weatherP;
    if (my!==token) return;
    state.results = w ? rank(w,j) : rank({feel:20,wind:0},{score:70});
    renderList();
  }
}

// 시작: 저장된 지역이 없으면 의왕시청
(function start(){
  let sido="경기도", city="의왕";
  try{ const s = JSON.parse(store.get("th-region")||"null"); if(s && REGIONS[s[0]] && REGIONS[s[0]].some(c=>c[0]===s[1])){ sido=s[0]; city=s[1]; } }catch(e){}
  applyTheme(); fillSido(sido); fillCity(sido, city); setRegion(sido, city);
})();
